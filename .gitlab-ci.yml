image: gradle:8.4-jdk17

stages:
  - build
  - test
  - metrics

before_script:
  - echo "Start Automated Build"
  - export GRADLE_USER_HOME=`pwd`/.gradle
  - chmod +x ./gradlew
  - git config --global http.sslVerify false

cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches

build:
  stage: build
  script:
    - ./gradlew assemble
  tags:
    - docker-runner
  artifacts:
    paths:
      - app/build/libs/*.jar
    expire_in: 1 week

test_black_box:
  stage: test
  tags:
    - docker-runner
  script:
    - ./gradlew test
  artifacts:
    paths:
      - build/test-results/test/TEST-*.xml

test_white_box:
  stage: test
  tags:
    - docker-runner
  script:
    - ./gradlew jacocoTestReport
  artifacts:
    paths:
      - build/reports/jacoco*

pmd_analysis:
  stage: metrics
  tags:
    - docker-runner
  script:
    - ./gradlew pmdMain pmdTest  
  artifacts:
    name: "pmd-report"
    paths:
      - build/reports/pmd/       
    when: always                 
    expire_in: 1 week

after_script:
  - echo "End Automated Build"
